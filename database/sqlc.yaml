version: "2"
sql:
  - engine: "postgresql"
    queries:
      - "queries/achievements"
      - "queries/combat_achievements"
      - "queries/events"
      - "queries/guilds"
      - "queries/points"
      - "queries/ranks"
      - "queries/records"
      - "queries/rsns"
      - "queries/teams"
      - "queries/users"
      - "queries/guild_details.sql"
      - "queries/misc.sql"
      - "queries/user_details.sql"
    schema: "migrations"
    gen:
      go:
        emit_json_tags: true
        package: "database"
        out: "."
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
